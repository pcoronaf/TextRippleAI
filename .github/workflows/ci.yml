name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No lockfile is committed yet, so `npm install` rather than `npm ci`.
      - run: npm install

      - name: Capture the resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the running app
        run: |
          npm start &
          node scripts/smoke.mjs

  migrations:
    name: PostgreSQL schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: textripple
          POSTGRES_PASSWORD: textripple
          POSTGRES_DB: textripple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textripple"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://textripple:textripple@localhost:5432/textripple
        run: npm run db:migrate

      - name: Re-apply migrations (must be idempotent)
        env:
          DATABASE_URL: postgres://textripple:textripple@localhost:5432/textripple
        run: npm run db:migrate

  windows-exe:
    name: Windows single-file executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build the app
        run: npm run build

      - name: Package it into one executable
        run: npm run build:exe

      # The point of this job: the packaged binary is started here, so a build
      # that unpacks or boots wrong fails in CI rather than on a desktop.
      - name: Start the packaged app and check it answers
        run: .\dist\TextRippleAI.exe --smoke

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: TextRippleAI-windows-x64
          path: dist/TextRippleAI.exe
          if-no-files-found: error
          retention-days: 30
